# 80 端口只做两件事:放行 ACME 续期挑战,其余全部跳 HTTPS。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://43.130.127.226.sslip.io$request_uri;
    }
}

server {
    # nginx 1.24:http2 写在 listen 上;1.25+ 才是独立的 http2 on;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 43.130.127.226.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/43.130.127.226.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.130.127.226.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 头像上限 8MB 且走 base64(膨胀 1.33 倍),默认 1m 会直接 413
    client_max_body_size 12m;

    # 后端接口。用正则而不是前缀匹配:前缀 location /chat 会连 /chats
    # 一起吃掉(那是网页端的对话页路由),(/|$) 这个边界把它挡住。
    # 新增后端路由时记得同步这里,否则会落到静态站返回 index.html。
    location ~ ^/(auth|chat|diaries|dm|health|judge|persona-cards|users|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 蒸馏和对话都是长请求,默认 60s 会截断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Expo 静态导出:每个路由是一个 .html;动态路由(/visit/xxx)没有对应
    # 文件,兜底回 index.html 由客户端路由接管
    root /var/www/agentdiary;
    index index.html;

    location /_expo/ {
        # 打包产物文件名带内容哈希,可以长缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
